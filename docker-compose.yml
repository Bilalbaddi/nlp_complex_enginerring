# OPTIONAL alternative: the project runs natively (see README). Nothing depends on this file.
# It runs a local Postgres for offline use; Supabase Storage still needs SUPABASE_URL / SERVICE_ROLE_KEY.
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sgdss}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgdss} -d ${POSTGRES_DB:-sgdss}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sgdss}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sgdss}
      MIGRATION_DATABASE_URL: ""
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
